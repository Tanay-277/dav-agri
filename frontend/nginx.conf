# DAV frontend + reverse proxy.
#
# Serving the API from the same origin as the app is what makes the mobile
# access model work (docs/MOBILE.md). It removes the hardcoded `localhost`
# host AND the cross-origin requirement entirely, so a phone on any network
# can reach the app without per-origin CORS configuration.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Voice payloads can be large; the default 1m nginx limit is fine but be explicit.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TTS (Edge/gTTS) calls out to the internet and may be slow on first use.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Stream synthesized audio straight through instead of buffering.
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    # The backend redirects /api/v1/openapi.json to /openapi.json (and
    # /api/v1/docs to /docs), so these exact root paths must be proxied too.
    # Without them the SPA fallback below would answer with index.html and the
    # client would try to parse HTML as JSON.
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $host;
    }

    # Single-page app: every unmatched route returns index.html so client-side
    # routing works on refresh.
    # SPA fallback and manifest must not be cached, or a deployed update would
    # never reach an already-installed app.
    location = /manifest.webmanifest {
        types { } default_type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}