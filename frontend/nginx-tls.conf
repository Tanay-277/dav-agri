# DAV frontend served over HTTPS with a reverse proxy to the backend.
#
# WHY HTTPS IS REQUIRED (docs/MOBILE.md, M3)
# Microphone capture via getUserMedia is only available in a "secure context".
# Browsers treat https:// and http://localhost as secure, but a plain http:// URL
# on a LAN address is NOT. DAV is voice-first, so without TLS the microphone is
# blocked on every real handset.
#
# Enabled via:  docker compose --profile tls up --build -d
# Certs come from ../generate-dev-certs.ps1 (self-signed, DEVELOPMENT ONLY).

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS so a phone that lands on http:// still gets a secure context.
    # A browser on a LAN IP would otherwise stay in an insecure context and lose the mic.
    # The port is explicit: $host omits it, and the compose file publishes 8443.
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev-cert.crt;
    ssl_certificate_key /etc/nginx/certs/dev-key.key;

    # Self-signed development certificate. A real deployment must use a
    # certificate from a trusted CA; browsers may treat an untrusted origin as
    # insecure and block the microphone even when TLS is technically on.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # TTS (Edge/gTTS) calls out to the internet and can be slow on first use.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Stream synthesized audio straight through instead of buffering.
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    # The backend redirects /api/v1/openapi.json to /openapi.json (and
    # /api/v1/docs to /docs), so these exact root paths must be proxied too.
    # Without them the SPA fallback below would answer with index.html and the
    # client would try to parse HTML as JSON.
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $host;
    }

    # The service worker must be served from the root scope and must never be
    # cached, or a stale worker would pin users to an old build. Over HTTPS it is
    # already same-origin and reachable at /sw.js via the static root.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # The manifest is fetched on every install; do not let it go stale either.
    # nginx has no mapping for .webmanifest, so it would otherwise be served as
    # application/octet-stream and some launchers reject it.
    location = /manifest.webmanifest {
        types { } default_type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
