[project]
name = "agristory-backend"
version = "0.1.0"
description = "Backend for Voice-Interactive Data Storytelling System for Rural/Low-Literacy Populations"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "python-dotenv==1.1.0",
    "python-multipart==0.0.32",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pydantic==2.11.1",
    "pydantic-settings==2.8.1",
    "reportlab==4.2.5",
    "httpx==0.28.1",
]

[project.optional-dependencies]
ai = ["google-genai==1.5.0"]
stt = ["faster-whisper==1.1.0"]
tts = ["edge-tts==7.0.0"]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = [
    ".*/site-packages/.*",
    ".*/dist-packages/.*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
